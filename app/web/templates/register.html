<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Create account — ZBR FF GLORY</title>
<link rel="stylesheet" href="/static/css/theme.css">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
  body{
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;min-height:100dvh;
    background:
      radial-gradient(900px 500px at 15% 0%, rgba(79,70,229,.10), transparent 60%),
      radial-gradient(700px 500px at 85% 100%, rgba(124,58,237,.08), transparent 60%),
      var(--bg);
    padding:20px;
    padding-top:calc(20px + env(safe-area-inset-top,0px));
    padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  }
  .auth-shell{width:420px;max-width:100%;}
  .auth-card{
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:20px;
    padding:40px 36px;
    box-shadow:var(--shadow-xl);
  }
  .auth-logo{
    display:flex;align-items:center;gap:12px;
    justify-content:center;margin-bottom:22px;
  }
  .auth-logo .mark{
    width:48px;height:48px;border-radius:14px;
    background:linear-gradient(145deg,var(--brand),#7c3aed);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 12px 28px -8px rgba(79,70,229,.5);
  }
  .auth-logo .mark svg{width:24px;height:24px;color:#fff;}
  .auth-title{
    font-size:22px;font-weight:800;letter-spacing:-.5px;
    text-align:center;
  }
  .auth-sub{
    text-align:center;color:var(--text-dim);
    font-size:13.5px;margin-bottom:30px;font-weight:500;
  }
  .field{margin-bottom:18px;}
  .field label{
    display:block;font-size:12.5px;color:var(--text);
    margin-bottom:8px;font-weight:600;
  }
  .field input{
    width:100%;
    background:var(--bg);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:11px;
    padding:12px 14px;
    font-size:15px;
    outline:none;
    transition:border-color .15s,box-shadow .15s,background .15s;
    font-family:inherit;
  }
  .field input::placeholder{color:var(--text-faint);}
  .field input:hover{border-color:var(--border-strong);}
  .field input:focus{
    border-color:var(--brand);
    box-shadow:0 0 0 4px var(--brand-ring);
    background:var(--surface);
  }
  .field-hint{font-size:11.5px;color:var(--text-faint);margin-top:6px;}
  .btn-primary{
    width:100%;padding:13px;
    border:none;border-radius:11px;
    background:var(--brand);
    color:#fff;font-weight:700;font-size:14.5px;
    cursor:pointer;
    transition:background .15s,transform .1s,box-shadow .15s;
    box-shadow:0 8px 20px -6px rgba(79,70,229,.5);
    display:flex;align-items:center;justify-content:center;gap:8px;
    margin-top:4px;
  }
  .btn-primary:hover{background:var(--brand-hover);}
  .btn-primary:active{transform:scale(.98);}
  .btn-primary:disabled{opacity:.7;cursor:not-allowed;}
  .auth-error{
    display:none;align-items:flex-start;gap:10px;
    margin-top:16px;padding:11px 13px;border-radius:10px;
    background:var(--red-soft);
    border:1px solid color-mix(in srgb,var(--red) 30%,transparent);
    color:var(--red);
    font-size:12.5px;font-weight:500;line-height:1.5;
  }
  .auth-error svg{width:15px;height:15px;flex-shrink:0;margin-top:1px;}
  .auth-footer{
    text-align:center;margin-top:24px;padding-top:20px;
    border-top:1px solid var(--border-soft);
    font-size:12px;color:var(--text-faint);
  }
  @media(max-width:420px){
    .auth-card{padding:32px 24px;}
    .auth-title{font-size:20px;}
  }
</style>
</head>
<body>
  <div class="auth-shell">
    <form class="auth-card" id="registerForm" autocomplete="off">
      <div class="auth-logo">
        <div class="mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L3 7v6c0 5 4 8.5 9 9 5-.5 9-4 9-9V7l-9-5z"/>
            <path d="M9 12l2 2 4-4"/>
          </svg>
        </div>
      </div>
      <div class="auth-title">Create your account</div>
      <div class="auth-sub">Join ZBR FF GLORY — start with a free wallet</div>

      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="3-20 characters, letters/numbers/underscore" required autofocus autocapitalize="off" spellcheck="false" minlength="3" maxlength="20">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required autocapitalize="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="At least 6 characters" required minlength="6">
        <div class="field-hint">You'll start with a $0.00 balance — redeem a code or ask an admin to top it up. Each squad you build costs $1.00.</div>
      </div>
      <div class="field" style="display:flex;justify-content:center;margin-bottom:14px;">
        <div class="cf-turnstile"
             data-sitekey="__SITE_KEY__"
             data-callback="onRegTurnstile"
             data-expired-callback="onRegTurnstileExpired"
             data-theme="auto">
        </div>
      </div>
      <button type="submit" class="btn-primary" id="registerBtn" disabled>Complete the check above</button>
      <div class="auth-error" id="authError"></div>

      <div class="auth-footer">Already have an account? <a href="/login" style="color:var(--brand);font-weight:650;">Sign in</a></div>
    </form>
  </div>

<script>
const form = document.getElementById('registerForm');
const err = document.getElementById('authError');
const btn = document.getElementById('registerBtn');
let turnstileToken = null;

function onRegTurnstile(token){
  turnstileToken = token;
  btn.disabled = false;
  btn.textContent = 'Create account';
}
function onRegTurnstileExpired(){
  turnstileToken = null;
  btn.disabled = true;
  btn.textContent = 'Complete the check above';
}

function showError(msg){
  err.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/></svg><span>${msg}</span>`;
  err.style.display = 'flex';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.style.display = 'none';
  if (!turnstileToken) {
    showError('Please complete the verification check.');
    return;
  }
  btn.disabled = true; btn.textContent = 'Creating account...';
  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        username: document.getElementById('username').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        turnstile_token: turnstileToken,
      }),
    });
    const data = await res.json();
    if (data.status === 'ok') {
      window.location.href = '/dashboard';
    } else if (data.error) {
      showError(data.error);
    } else if (Array.isArray(data.detail) && data.detail[0]) {
      showError(data.detail[0].msg || 'Could not create account');
    } else {
      showError(typeof data.detail === 'string' ? data.detail : 'Could not create account');
    }
  } catch (e2) {
    showError('Network error. Please try again.');
  } finally {
    turnstileToken = null;
    if (window.turnstile) window.turnstile.reset();
    btn.disabled = true; btn.textContent = 'Complete the check above';
  }
});
</script>
</body>
</html>
