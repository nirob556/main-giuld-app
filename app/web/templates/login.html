<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in — ZBR FF GLORY</title>
<link rel="stylesheet" href="/static/css/theme.css">
<style>
  body{
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;min-height:100dvh;
    background:
      radial-gradient(900px 500px at 15% 0%, rgba(79,70,229,.10), transparent 60%),
      radial-gradient(700px 500px at 85% 100%, rgba(124,58,237,.08), transparent 60%),
      var(--bg);
    padding:20px;
    padding-top:calc(20px + env(safe-area-inset-top,0px));
    padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  }
  .auth-shell{width:420px;max-width:100%;}
  .auth-card{
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:20px;
    padding:40px 36px;
    box-shadow:var(--shadow-xl);
  }
  .auth-logo{
    display:flex;align-items:center;gap:12px;
    justify-content:center;margin-bottom:22px;
  }
  .auth-logo .mark{
    width:48px;height:48px;border-radius:14px;
    background:linear-gradient(145deg,var(--brand),#7c3aed);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 12px 28px -8px rgba(79,70,229,.5);
  }
  .auth-logo .mark svg{width:24px;height:24px;color:#fff;}
  .auth-title{
    font-size:22px;font-weight:800;letter-spacing:-.5px;
    text-align:center;
  }
  .auth-sub{
    text-align:center;color:var(--text-dim);
    font-size:13.5px;margin-bottom:30px;font-weight:500;
  }
  .field{margin-bottom:18px;}
  .field label{
    display:block;font-size:12.5px;color:var(--text);
    margin-bottom:8px;font-weight:600;
  }
  .field input{
    width:100%;
    background:var(--bg);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:11px;
    padding:12px 14px;
    font-size:15px;
    outline:none;
    transition:border-color .15s,box-shadow .15s,background .15s;
    font-family:inherit;
  }
  .field input::placeholder{color:var(--text-faint);}
  .field input:hover{border-color:var(--border-strong);}
  .field input:focus{
    border-color:var(--brand);
    box-shadow:0 0 0 4px var(--brand-ring);
    background:var(--surface);
  }
  .btn-primary{
    width:100%;padding:13px;
    border:none;border-radius:11px;
    background:var(--brand);
    color:#fff;font-weight:700;font-size:14.5px;
    cursor:pointer;
    transition:background .15s,transform .1s,box-shadow .15s;
    box-shadow:0 8px 20px -6px rgba(79,70,229,.5);
    display:flex;align-items:center;justify-content:center;gap:8px;
    margin-top:4px;
  }
  .btn-primary:hover{background:var(--brand-hover);}
  .btn-primary:active{transform:scale(.98);}
  .btn-primary:disabled{opacity:.7;cursor:not-allowed;}
  .auth-error{
    display:none;align-items:flex-start;gap:10px;
    margin-top:16px;padding:11px 13px;border-radius:10px;
    background:var(--red-soft);
    border:1px solid color-mix(in srgb,var(--red) 30%,transparent);
    color:var(--red);
    font-size:12.5px;font-weight:500;line-height:1.5;
  }
  .auth-error svg{width:15px;height:15px;flex-shrink:0;margin-top:1px;}
  .auth-footer{
    text-align:center;margin-top:24px;padding-top:20px;
    border-top:1px solid var(--border-soft);
    font-size:12px;color:var(--text-faint);
  }
  @media(max-width:420px){
    .auth-card{padding:32px 24px;}
    .auth-title{font-size:20px;}
  }
</style>
</head>
<body>
  <div class="auth-shell">
    <form class="auth-card" id="loginForm" autocomplete="off">
      <div class="auth-logo">
        <div class="mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L3 7v6c0 5 4 8.5 9 9 5-.5 9-4 9-9V7l-9-5z"/>
            <path d="M9 12l2 2 4-4"/>
          </svg>
        </div>
      </div>
      <div class="auth-title">ZBR FF GLORY</div>
      <div class="auth-sub">Squad Operations Console</div>

      <div class="field">
        <label for="login">Username or email</label>
        <input type="text" id="login" name="login" placeholder="Enter your username or email" required autofocus autocapitalize="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn-primary" id="loginBtn">Sign in</button>
      <div class="auth-error" id="authError"></div>

      <div class="auth-footer">Don't have an account? <a href="/register" style="color:var(--brand);font-weight:650;">Register</a></div>
    </form>
  </div>

<script>
const form = document.getElementById('loginForm');
const err = document.getElementById('authError');
const btn = document.getElementById('loginBtn');

function showError(msg){
  err.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/></svg><span>${msg}</span>`;
  err.style.display = 'flex';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Signing in...';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        login: document.getElementById('login').value,
        password: document.getElementById('password').value,
      }),
    });
    const data = await res.json();
    if (data.status === 'ok') {
      window.location.href = '/dashboard';
    } else {
      showError(data.error || 'Invalid credentials');
    }
  } catch (e2) {
    showError('Network error. Please try again.');
  } finally {
    btn.disabled = false; btn.textContent = 'Sign in';
  }
});
</script>
</body>
</html>
